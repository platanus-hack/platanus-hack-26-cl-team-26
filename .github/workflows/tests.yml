# Tests en cada push y pull request: optimizador, contrato de datos, vulnerabilidad, servidor y aire.
# BirdNET (requirements-captura.txt, experimento de captura en terreno) no se instala: los tests no lo necesitan.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m tests.test_contrato
      - run: python -m tests.test_vulnerabilidad
